<text class="t" x="464.2" y="328.0" text-anchor="middle">2</text>
<text class="t3" x="464.2" y="344.0" text-anchor="middle">+phase</text>
<path d="M574.8,306.0 V99.1 Q574.8,95.1 578.8,95.1 H658.8 Q662.8,95.1 662.8,99.1 V306.0 Z" fill="var(--q4)"/>
