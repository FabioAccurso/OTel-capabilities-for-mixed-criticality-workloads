<svg id="fig1-overhead-per-livello" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="100%" role="img" aria-label="Costo dell'instrumentazione, per giro del task critico">
<style>
#fig1-overhead-per-livello{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--ink3:#7b7a75;--grid:#e6e5e1;--axis:#c9c8c3;--s1:#2a78d6;--s2:#eb6834;--crit:#d03b3b;--q1:#86b6ef;--q2:#5598e7;--q3:#2a78d6;--q4:#1c5cab;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) #fig1-overhead-per-livello{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#94938b;--grid:#33332f;--axis:#4a4a45;--s1:#3987e5;--s2:#d95926;--crit:#d03b3b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#86b6ef;}
}
:root[data-theme="dark"] #fig1-overhead-per-livello{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#94938b;--grid:#33332f;--axis:#4a4a45;--s1:#3987e5;--s2:#d95926;--crit:#d03b3b;--q1:#184f95;--q2:#256abf;--q3:#3987e5;--q4:#86b6ef;}
#fig1-overhead-per-livello .bg{fill:var(--surface)}
#fig1-overhead-per-livello .grid{stroke:var(--grid);stroke-width:1}
#fig1-overhead-per-livello .axis{stroke:var(--axis);stroke-width:1}
#fig1-overhead-per-livello .t{fill:var(--ink);font-size:13px}
#fig1-overhead-per-livello .t2{fill:var(--ink2);font-size:12px}
#fig1-overhead-per-livello .t3{fill:var(--ink3);font-size:11px}
#fig1-overhead-per-livello .ttl{fill:var(--ink);font-size:15px;font-weight:600}
#fig1-overhead-per-livello .sub{fill:var(--ink2);font-size:12px}
#fig1-overhead-per-livello .val{fill:var(--ink);font-size:12px;font-weight:600}
</style>
<rect class="bg" x="0" y="0" width="720" height="380"/>
<text class="ttl" x="16" y="26">Costo dell'instrumentazione, per giro del task critico</text>
<text class="sub" x="16" y="45">Blocco 1 — HI da solo, BatchSpanProcessor, AlwaysOn. Mediana su 20 ripetizioni, misurato sullo slack.</text>
