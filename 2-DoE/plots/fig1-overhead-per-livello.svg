<text class="t3" x="68" y="82.0" text-anchor="end">60</text>
<text class="t3" x="16" y="64">µs per giro</text>
<line class="axis" x1="78" y1="306" x2="696" y2="306"/>
<path d="" fill="var(--q1)"/>
<text class="val" x="155.2" y="297.0" text-anchor="middle">—</text>
<text class="t" x="155.2" y="328.0" text-anchor="middle">0</text>
<text class="t3" x="155.2" y="344.0" text-anchor="middle">nessuno</text>
<path d="M265.8,306.0 V194.1 Q265.8,190.1 269.8,190.1 H349.8 Q353.8,190.1 353.8,194.1 V306.0 Z" fill="var(--q2)"/>
<text class="val" x="309.8" y="181.1" text-anchor="middle">+30 µs</text>
<text class="t" x="309.8" y="328.0" text-anchor="middle">1</text>
<text class="t3" x="309.8" y="344.0" text-anchor="middle">main+thread</text>
<path d="M420.2,306.0 V194.1 Q420.2,190.1 424.2,190.1 H504.2 Q508.2,190.1 508.2,194.1 V306.0 Z" fill="var(--q3)"/>
