<text class="t3" x="618.8" y="344.0" text-anchor="middle">+phase_loop</text>
<text class="t3" x="360.0" y="368" text-anchor="middle">RTAPP_TRACE_LEVEL — 0 deadline miss a ogni livello, su ~160000 giri</text>
